openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product management
  - name: storage
    description: Object storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiProduct"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProduct"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiProduct"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        tagline:
          type: string
        description:
          type: string
        version:
          type: string
        status:
          type: string
        features:
          type: array
          items:
            type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        apkUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        telegramUrl:
          type: ["string", "null"]
        screenshot1Url:
          type: ["string", "null"]
        screenshot2Url:
          type: ["string", "null"]
        screenshot3Url:
          type: ["string", "null"]
        screenshot4Url:
          type: ["string", "null"]
        accentColor:
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - name
        - category
        - tagline
        - description
        - version
        - status
        - features
        - accentColor
        - sortOrder

    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        tagline:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        status:
          type: string
        features:
          type: array
          items:
            type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        apkUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        telegramUrl:
          type: ["string", "null"]
        screenshot1Url:
          type: ["string", "null"]
        screenshot2Url:
          type: ["string", "null"]
        screenshot3Url:
          type: ["string", "null"]
        screenshot4Url:
          type: ["string", "null"]
        accentColor:
          type: string
        sortOrder:
          type: integer
      required:
        - name
        - category
        - tagline
        - description
        - version
        - status
        - features
        - accentColor
        - sortOrder

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        tagline:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        status:
          type: string
        features:
          type: array
          items:
            type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        apkUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        telegramUrl:
          type: ["string", "null"]
        screenshot1Url:
          type: ["string", "null"]
        screenshot2Url:
          type: ["string", "null"]
        screenshot3Url:
          type: ["string", "null"]
        screenshot4Url:
          type: ["string", "null"]
        accentColor:
          type: string
        sortOrder:
          type: integer

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DeletedResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
